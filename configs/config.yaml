project_name: "Cervical_Scan_Pipeline"
dataset_path: "data/"
batch_size: 8
num_workers: 0
learning_rate: 0.0001
max_epochs: 100
image_size: 256
seed: 42
weights_save_path: "checkpoints/"
logging_freq: 10
resume_training: false
backbone: "resnet50"
projection_dim: 128
temperature: 0.1
accumulate_grad_batches: 1
pretrained: true
loss: "contrastive"
augmentations:
  flip: true
  rotation: 15
  color_jitter: 0.2
  scale: [0.8, 1.2]
  crop_size: 224
model_params:
  mlp_hidden_dim: 2048
  projection_head_hidden_dim: 512
  attention_heads: 4
  num_classes: 2 # benign/malignant
  severity_classes: 3 # low, moderate, severe
